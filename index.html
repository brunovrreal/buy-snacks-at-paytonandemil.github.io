<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emil & Payton</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main { text-align: center; padding: 30px; }
    .typewriter {
      display: inline-block;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: 2px;
      border-right: 4px solid #fff;
      padding-right: 8px;
      animation: blink .7s step-end infinite;
    }
    nav { margin-top: 35px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
    a {
      color: #fff;
      background: #e00000;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { background: #ff2222; }
    @keyframes blink { 50% { border-color: transparent; } }
  </style>
</head>
<body>
  <main>
    <div id="typewriter" class="typewriter" aria-live="polite"></div>
    <nav>
      <a href="snacks.html">Snacks</a>
      <a href="cashapp.html">Cash App</a>
    </nav>
  </main>

  <script>
    const names = ["Emil", "Payton"];
    let nameIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function typeWriter() {
      const current = names[nameIndex];

      if (!deleting) {
        charIndex++;
        document.getElementById("typewriter").textContent = current.slice(0, charIndex);
        if (charIndex === current.length) {
          deleting = true;
          setTimeout(typeWriter, 1400);
          return;
        }
      } else {
        charIndex--;
        document.getElementById("typewriter").textContent = current.slice(0, charIndex);
        if (charIndex === 0) {
          deleting = false;
          nameIndex = (nameIndex + 1) % names.length;
        }
      }

      setTimeout(typeWriter, deleting ? 90 : 150);
    }

    typeWriter();
  </script>
</body>
</html>
